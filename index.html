        window.handleModelUpload = function(event) {
            const file = event.target.files[0]; 
            if (!file) return;
            const url = URL.createObjectURL(file); 
            const ext = file.name.split('.').pop().toLowerCase();
            window.showAlert("Importing model... Please wait."); 
            window.togglePanel('add-menu');
            
            if (ext === 'glb' || ext === 'gltf') {
                import('three/addons/loaders/GLTFLoader.js').then(({ GLTFLoader }) => { 
                    new GLTFLoader().load(url, (gltf) => processImport(gltf, file.name, true)); 
                }).catch(e => window.showAlert("Import Error: " + e.message));
            } else if (ext === 'obj') {
                import('three/addons/loaders/OBJLoader.js').then(({ OBJLoader }) => { 
                    new OBJLoader().load(url, (obj) => processImport(obj, file.name, false)); 
                }).catch(e => window.showAlert("Import Error: " + e.message));
            }
        };

        function processImport(importedData, name, isGLTF) {
            const group = isGLTF ? importedData.scene : importedData; 
            group.name = name.split('.')[0]; 
            group.userData.isGroup = true; 
            group.userData.expanded = true;
            
            const box = new THREE.Box3().setFromObject(group); 
            const center = box.getCenter(new THREE.Vector3()); 
            const size = box.getSize(new THREE.Vector3()); 
            const maxDim = Math.max(size.x, size.y, size.z);
            let scale = maxDim > 0 ? 4.0 / maxDim : 1;
            
            group.position.set(-center.x * scale, -box.min.y * scale, -center.z * scale); 
            group.scale.set(scale, scale, scale);
            
            let hasBones = false;
            
            group.traverse((child) => {
                if (child.isMesh || child.isSkinnedMesh) {
                    child.castShadow = true; 
                    child.receiveShadow = true;
                    
                    let oldMat = child.material; 
                    if (Array.isArray(oldMat)) oldMat = oldMat[0]; 
                    
                    child.material = new THREE.MeshStandardMaterial({ 
                        color: oldMat?.color || 0xcccccc, 
                        map: oldMat?.map || null, 
                        normalMap: oldMat?.normalMap || null, 
                        roughness: 0.5, 
                        metalness: 0.1, 
                        skinning: true 
                    });
                    child.material.name = oldMat?.name || child.name || "Material";
                    window.engine.objectsList.push(child); 
                    window.engine.animations.set(child.uuid, new AnimTrack());
                } else if (child.isBone) {
                    hasBones = true; 
                    child.userData.expanded = false;
                    const proxy = new THREE.Mesh(new THREE.OctahedronGeometry(0.12, 0), new THREE.MeshBasicMaterial({color: 0x3b82f6, wireframe: true, depthTest: false, transparent: true, opacity: 0.6}));
                    proxy.userData.isBoneProxy = true; 
                    proxy.userData.targetBone = child; 
                    child.add(proxy);
                    window.engine.objectsList.push(child); 
                    window.engine.animations.set(child.uuid, new AnimTrack());
                } else if (child.isGroup || child.type === 'Object3D') {
                    child.userData.isGroup = true; 
                    child.userData.expanded = false; 
                    window.engine.objectsList.push(child); 
                    window.engine.animations.set(child.uuid, new AnimTrack());
                }
            });

            if (isGLTF && importedData.animations && importedData.animations.length > 0) {
                const mixer = new THREE.AnimationMixer(group);
                importedData.animations.forEach(clip => { mixer.clipAction(clip).play(); });
                window.engine.mixers.push(mixer);
                window.showAlert("Imported model with " + importedData.animations.length + " animations!");
            }

            if (hasBones) { 
                const helper = new THREE.SkeletonHelper(group); 
                helper.material.linewidth = 2; 
                window.engine.scene.add(helper); 
            }
            
            window.engine.scene.add(group);
            if (!window.engine.objectsList.includes(group)) { 
                window.engine.objectsList.push(group); 
                window.engine.animations.set(group.uuid, new AnimTrack()); 
            }
            
            window.buildOutliner(); 
            window.hideAlert(); 
            window.engine.selectObject(group);
        }

        // --- EXPORT WATERMARK RENDERS ---
        window.exportPNG = function() {
            if(!window.engine) return;
            window.engine.gizmo.visible = false; 
            window.engine.grid.visible = false;
            
            window.engine.objectsList.forEach(obj => { 
                if(obj.userData.isLightWrapper) obj.material.visible = false; 
                if(obj.userData.isCameraWrapper) obj.children.forEach(c => { if(c.isMesh) c.visible = false; }); 
                if(obj.isBone) obj.children.forEach(c => { if(c.userData.isBoneProxy) c.visible = false; });
            });

            window.isExporting = true; 
            window.engine.renderer.clear(); 
            window.engine.renderer.render(window.engine.scene, window.engine.activeCamera || window.engine.camera);
            window.engine.renderer.autoClear = false; 
            window.engine.renderer.render(window.engine.hudScene, window.engine.hudCamera); 
            window.engine.renderer.autoClear = true; 
            window.isExporting = false;
            
            const dataURL = window.engine.canvas.toDataURL('image/png'); 
            const a = document.createElement('a'); 
            a.href = dataURL; 
            a.download = 'Render.png'; 
            a.click();
            
            window.engine.gizmo.visible = true; 
            window.engine.grid.visible = true;
            window.engine.objectsList.forEach(obj => { 
                if(obj.userData.isLightWrapper) obj.material.visible = true; 
                if(obj.userData.isCameraWrapper && window.engine.activeCamera !== obj.userData.cameraObj) obj.children.forEach(c => { if(c.isMesh) c.visible = true; });
                if(obj.isBone) obj.children.forEach(c => { if(c.userData.isBoneProxy) c.visible = true; });
            });
            window.showAlert("PNG Saved!"); 
            setTimeout(window.hideAlert, 1500);
        };

        window.exportVideo = function() {
            if(!window.engine) return;
            window.showAlert("Rendering Video... Please wait " + window.engine.duration + " seconds.");
            window.engine.gizmo.visible = false; 
            window.engine.grid.visible = false;
            
            window.engine.objectsList.forEach(obj => { 
                if(obj.userData.isLightWrapper) obj.material.visible = false; 
                if(obj.userData.isCameraWrapper) obj.children.forEach(c => { if(c.isMesh) c.visible = false; }); 
                if(obj.isBone) obj.children.forEach(c => { if(c.userData.isBoneProxy) c.visible = false; });
            });

            window.isExporting = true; 
            
            let options = {}; 
            if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) options = { mimeType: 'video/webm;codecs=vp9' }; 
            else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp8')) options = { mimeType: 'video/webm;codecs=vp8' }; 
            else if (MediaRecorder.isTypeSupported('video/webm')) options = { mimeType: 'video/webm' }; 
            else if (MediaRecorder.isTypeSupported('video/mp4')) options = { mimeType: 'video/mp4' };
            
            const stream = window.engine.canvas.captureStream(30); 
            const recorder = new MediaRecorder(stream, options); 
            const chunks = []; 
            
            recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: options.mimeType || 'video/webm' }); 
                const url = URL.createObjectURL(blob); 
                const a = document.createElement('a'); 
                a.href = url; 
                a.download = 'Animation_Render.webm'; 
                a.click(); 
                URL.revokeObjectURL(url);
                
                window.isExporting = false; 
                window.engine.gizmo.visible = true; 
                window.engine.grid.visible = true;
                
                window.engine.objectsList.forEach(obj => { 
                    if(obj.userData.isLightWrapper) obj.material.visible = true; 
                    if(obj.userData.isCameraWrapper && window.engine.activeCamera !== obj.userData.cameraObj) obj.children.forEach(c => { if(c.isMesh) c.visible = true; });
                    if(obj.isBone) obj.children.forEach(c => { if(c.userData.isBoneProxy) c.visible = true; });
                });
                window.hideAlert();
            };
            
            window.engine.currentTime = 0; 
            window.engine.isPlaying = true; 
            document.getElementById('play-icon').className = 'fa-solid fa-pause'; 
            recorder.start(); 
            
            setTimeout(() => { 
                recorder.stop(); 
                window.engine.isPlaying = false; 
                document.getElementById('play-icon').className = 'fa-solid fa-play'; 
            }, window.engine.duration * 1000);
        };

        // --- TIMELINE CONTROLS ---
        window.confirmAnimationTrack = function() {
            let maxT = parseFloat(document.getElementById('anim-time-input').value); 
            if (isNaN(maxT) || maxT < 1.0) maxT = 5.0; 
            window.MAX_TIMELINE_SEC = maxT; 
            window.engine.duration = maxT; 
            window.hasAnimationTrack = true;
            
            document.getElementById('create-track-btn').style.display = 'none'; 
            document.getElementById('anim-clip').style.display = 'flex'; 
            document.getElementById('anim-clip').style.width = '100%'; 
            
            window.togglePanel('anim-setup-modal'); 
            window.updateTimelineUI();
        };

        window.togglePlay = function() {
            if (!window.hasAnimationTrack) return window.showAlert("Create an Animation Track first!"); 
            window.engine.isPlaying = !window.engine.isPlaying; 
            document.getElementById('play-icon').className = window.engine.isPlaying ? 'fa-solid fa-pause' : 'fa-solid fa-play';
        };
        
        window.setTimeFromInput = function(val) {
            if (!window.hasAnimationTrack) return; 
            let t = Math.max(0, Math.min(parseFloat(val) || 0, window.engine.duration)); 
            window.engine.currentTime = t; 
            window.updateTimelineUI();
            
            window.engine.objectsList.forEach(obj => { 
                const track = window.engine.animations.get(obj.uuid); 
                if(track) track.apply(t, obj); 
            }); 
            window.engine.mixers.forEach(m => m.setTime(t)); 
            
            if(window.selectedObject && document.getElementById('properties-panel').style.display === 'block') window.updateTransformUI();
        };

        window.addKeyframe = function() {
            if (!window.hasAnimationTrack) return; 
            if(!window.selectedObject) return window.showAlert("Select an object or bone to animate!");
            
            const track = window.engine.animations.get(window.selectedObject.uuid); 
            if(track) { 
                track.addKey(window.engine.currentTime, window.selectedObject); 
                window.renderKeyframeMarkers(); 
            }
        };

        const trackContainer = document.getElementById('track-container');
        trackContainer.addEventListener('pointerdown', (e) => {
            if (!window.hasAnimationTrack) return; 
            if(e.target.closest('.key-btn-inline') || e.target.closest('.key-mark') || e.target.closest('.clip-handle-right')) return;
            
            window.isScrubbing = true; 
            window.engine.isPlaying = false; 
            document.getElementById('play-icon').className = 'fa-solid fa-play'; 
            trackContainer.setPointerCapture(e.pointerId); 

            const updatePos = (clientX) => {
                const rect = trackContainer.getBoundingClientRect(); 
                let x = Math.max(0, Math.min(clientX - rect.left, rect.width)); 
                window.engine.currentTime = (x / rect.width) * window.MAX_TIMELINE_SEC; 
                if (window.engine.currentTime > window.engine.duration) window.engine.currentTime = window.engine.duration;
                
                window.updateTimelineUI();
                
                window.engine.objectsList.forEach(obj => { 
                    const track = window.engine.animations.get(obj.uuid); 
                    if(track) track.apply(window.engine.currentTime, obj); 
                }); 
                window.engine.mixers.forEach(m => m.setTime(window.engine.currentTime)); 
                
                if(window.selectedObject && document.getElementById('properties-panel').style.display === 'block') window.updateTransformUI();
            };

            updatePos(e.clientX);
            
            const onMove = (ev) => updatePos(ev.clientX); 
            const onUp = (ev) => { 
                window.isScrubbing = false; 
                trackContainer.releasePointerCapture(ev.pointerId);
                trackContainer.removeEventListener('pointermove', onMove); 
                trackContainer.removeEventListener('pointerup', onUp); 
            };
            
            trackContainer.addEventListener('pointermove', onMove); 
            trackContainer.addEventListener('pointerup', onUp);
        });

        document.getElementById('clip-resizer').addEventListener('pointerdown', (e) => {
            if (!window.hasAnimationTrack) return; 
            e.stopPropagation(); 
            window.isScrubbing = true; 
            window.engine.isPlaying = false; 
            document.getElementById('play-icon').className = 'fa-solid fa-play';
            
            const handle = e.target; 
            handle.setPointerCapture(e.pointerId); 
            const container = document.getElementById('track-container'); 
            const clip = document.getElementById('anim-clip');
            
            const onMove = (ev) => {
                const rect = container.getBoundingClientRect(); 
                let x = Math.max(40, Math.min(ev.clientX - rect.left, rect.width)); 
                let percentage = (x / rect.width) * 100; 
                clip.style.width = percentage + '%';
                
                window.engine.duration = Math.max(0.5, (x / rect.width) * window.MAX_TIMELINE_SEC); 
                document.getElementById('anim-dur-text').innerText = window.engine.duration.toFixed(1) + 's';
                
                if (window.engine.currentTime > window.engine.duration) window.engine.currentTime = window.engine.duration; 
                window.updateTimelineUI(); 
                window.renderKeyframeMarkers();
            };
            
            const onUp = (ev) => { 
                window.isScrubbing = false; 
                handle.releasePointerCapture(ev.pointerId);
                handle.removeEventListener('pointermove', onMove); 
                handle.removeEventListener('pointerup', onUp); 
            };
            
            handle.addEventListener('pointermove', onMove); 
            handle.addEventListener('pointerup', onUp);
        });
        
        window.updateTimelineUI = function() {
            if (!window.hasAnimationTrack) return; 
            const percent = (window.engine.currentTime / window.MAX_TIMELINE_SEC) * 100; 
            document.getElementById('scrubber').style.left = percent + '%'; 
            document.getElementById('time-display').value = window.engine.currentTime.toFixed(2);
            
            const blockPercent = (window.engine.duration / window.MAX_TIMELINE_SEC) * 100; 
            document.getElementById('anim-clip').style.width = blockPercent + '%'; 
            document.getElementById('anim-dur-text').innerText = window.engine.duration.toFixed(1) + 's';
        };

        window.renderKeyframeMarkers = function() {
            const markerContainer = document.getElementById('track-markers'); 
            if(!markerContainer) return; 
            markerContainer.innerHTML = ''; 
            
            if(!window.selectedObject || !window.hasAnimationTrack) return; 
            const track = window.engine.animations.get(window.selectedObject.uuid); 
            if(!track) return;
            
            track.keys.forEach(k => {
                const mark = document.createElement('div'); 
                mark.className = 'key-mark'; 
                const percent = (k.time / window.MAX_TIMELINE_SEC * 100); 
                mark.style.left = percent + '%';
                
                mark.addEventListener('pointerdown', (e) => {
                    e.stopPropagation(); 
                    window.engine.isPlaying = false; 
                    document.getElementById('play-icon').className = 'fa-solid fa-play'; 
                    mark.setPointerCapture(e.pointerId);
                    
                    const container = document.getElementById('track-container');
                    const onMove = (ev) => {
                        const rect = container.getBoundingClientRect(); 
                        let maxX = (window.engine.duration / window.MAX_TIMELINE_SEC) * rect.width; 
                        let x = Math.max(0, Math.min(ev.clientX - rect.left, maxX)); 
                        let newTime = (x / rect.width) * window.MAX_TIMELINE_SEC; 
                        k.time = newTime; 
                        mark.style.left = (k.time / window.MAX_TIMELINE_SEC * 100) + '%'; 
                        window.setTimeFromInput(newTime); 
                    };
                    const onUp = (ev) => {
                        track.keys.sort((a, b) => a.time - b.time); 
                        window.renderKeyframeMarkers();
                        mark.releasePointerCapture(ev.pointerId);
                        mark.removeEventListener('pointermove', onMove); 
                        mark.removeEventListener('pointerup', onUp); 
                    };
                    mark.addEventListener('pointermove', onMove); 
                    mark.addEventListener('pointerup', onUp);
                }); 
                markerContainer.appendChild(mark);
            });
        };

        window.openProperties = function() {
            if(!window.selectedObject) { window.showAlert("Select an object first!"); return; }
            
            window.editingMaterials = [];
            if (window.selectedObject.userData.isGroup) {
                window.selectedObject.traverse(c => { if(c.isMesh && c.material) window.editingMaterials.push(c.material); });
                window.editingMaterials = [...new Set(window.editingMaterials)];
            } else if (window.selectedObject.material) {
                window.editingMaterials = [window.selectedObject.material];
            }
            if (window.editingMaterials.length > 0) window.activeEditingMaterial = window.editingMaterials[0];
            
            document.getElementById('properties-panel').style.display = 'block'; 
            window.buildPropertiesPanel();
        };

        window.updateObjectName = function(val) { 
            if(window.selectedObject) { 
                window.selectedObject.name = val; 
                window.buildOutliner(); 
            } 
        };

        window.togglePilot = function() {
            if (window.engine.activeCamera === window.selectedObject.userData.cameraObj) {
                window.engine.activeCamera = null; 
                window.engine.controls.enabled = true; 
                window.engine.gizmo.visible = true; 
                window.selectedObject.children.forEach(c => { if(c.isMesh) c.visible = true; }); 
            } else {
                if (window.engine.activeCamera) {
                    window.engine.objectsList.forEach(obj => { 
                        if(obj.userData.isCameraWrapper && obj.userData.cameraObj === window.engine.activeCamera) { 
                            obj.children.forEach(c => { if(c.isMesh) c.visible = true; }); 
                        } 
                    }); 
                }
                window.engine.activeCamera = window.selectedObject.userData.cameraObj; 
                window.engine.controls.enabled = false; 
                window.engine.gizmo.visible = false; 
                window.selectedObject.children.forEach(c => { if(c.isMesh) c.visible = false; }); 
                window.showAlert("Pilot Mode Enabled.");
            }
            window.buildPropertiesPanel();
        };

        window.changeEditingMaterial = function(idx) { 
            window.activeEditingMaterial = window.editingMaterials[idx]; 
            window.buildPropertiesPanel(); 
        };

        // --- DIRECT MEDIA UPLOAD HANDLER ---
        window.handleDirectMediaUpload = function(event, targetProp) {
            if(!window.activeEditingMaterial || !event.target.files.length) return;
            const file = event.target.files[0];
            const url = URL.createObjectURL(file);

            if (file.type.startsWith('video/')) {
                const video = document.createElement('video');
                video.src = url;
                video.crossOrigin = "anonymous";
                video.loop = true;
                video.muted = true;
                video.playsInline = true;
                video.play();
                
                const tex = new THREE.VideoTexture(video);
                tex.colorSpace = (targetProp === 'map') ? THREE.SRGBColorSpace : THREE.NoColorSpace;
                tex.name = file.name;
                
                if (targetProp === 'ormMap') {
                    window.activeEditingMaterial.aoMap = tex;
                    window.activeEditingMaterial.roughnessMap = tex;
                    window.activeEditingMaterial.metalnessMap = tex;
                    if(window.selectedObject && window.selectedObject.geometry && window.selectedObject.geometry.attributes.uv && !window.selectedObject.geometry.attributes.uv2) {
                        window.selectedObject.geometry.setAttribute('uv2', window.selectedObject.geometry.attributes.uv);
                    }
                } else {
                    window.activeEditingMaterial[targetProp] = tex;
                }
                window.activeEditingMaterial.needsUpdate = true;
                window.buildPropertiesPanel();
                
            } else if (file.type.startsWith('image/')) {
                const img = new Image();
                img.onload = () => {
                    const tex = new THREE.Texture(img);
                    tex.colorSpace = (targetProp === 'map') ? THREE.SRGBColorSpace : THREE.NoColorSpace;
                    tex.wrapS = THREE.RepeatWrapping; 
                    tex.wrapT = THREE.RepeatWrapping;
                    tex.name = file.name;
                    
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width; canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    tex.userData = { src: canvas.toDataURL('image/png') };
                    
                    tex.needsUpdate = true;
                    
                    if (targetProp === 'ormMap') {
                        window.activeEditingMaterial.aoMap = tex;
                        window.activeEditingMaterial.roughnessMap = tex;
                        window.activeEditingMaterial.metalnessMap = tex;
                        if(window.selectedObject && window.selectedObject.geometry && window.selectedObject.geometry.attributes.uv && !window.selectedObject.geometry.attributes.uv2) {
                            window.selectedObject.geometry.setAttribute('uv2', window.selectedObject.geometry.attributes.uv);
                        }
                    } else {
                        window.activeEditingMaterial[targetProp] = tex;
                    }
                    
                    window.activeEditingMaterial.needsUpdate = true;
                    window.buildPropertiesPanel();
                };
                img.src = url;
            }
        };

        window.buildPropertiesPanel = function() {
            if(!window.selectedObject) return;
            const content = document.getElementById('prop-content'); 
            const isLight = window.selectedObject.userData.isLightWrapper; 
            const isCamera = window.selectedObject.userData.isCameraWrapper; 
            const isGroup = window.selectedObject.userData.isGroup; 
            const isBone = window.selectedObject.isBone;
            
            const titleText = isBone ? "Bone Transform" : (isGroup ? "Group Settings" : (isLight ? "Light Settings" : (isCamera ? "Camera Settings" : "Material Editor")));
            document.getElementById('prop-title').innerHTML = `${titleText} <span><button class="close-btn" onclick="window.togglePanel('properties-panel')"><i class="fa-solid fa-xmark"></i></button></span>`;
            
            content.innerHTML = `
                <div class="prop-row" style="margin-bottom:15px;">
                    <span class="prop-label">Name</span>
                    <input type="text" class="prop-input" value="${window.selectedObject.name}" onchange="window.updateObjectName(this.value)">
                </div>
                <div class="prop-row">
                    <span style="color:#ef4444" class="prop-label">X</span>
                    <input type="number" class="prop-input" id="px" step="0.1" oninput="window.updTrans('p','x',this.value)">
                    <input type="number" class="prop-input" id="rx" step="1" oninput="window.updTrans('r','x',this.value)">
                    <input type="number" class="prop-input" id="sx" step="0.1" oninput="window.updTrans('s','x',this.value)">
                </div>
                <div class="prop-row">
                    <span style="color:#22c55e" class="prop-label">Y</span>
                    <input type="number" class="prop-input" id="py" step="0.1" oninput="window.updTrans('p','y',this.value)">
                    <input type="number" class="prop-input" id="ry" step="1" oninput="window.updTrans('r','y',this.value)">
                    <input type="number" class="prop-input" id="sy" step="0.1" oninput="window.updTrans('s','y',this.value)">
                </div>
                <div class="prop-row">
                    <span style="color:#3b82f6" class="prop-label">Z</span>
                    <input type="number" class="prop-input" id="pz" step="0.1" oninput="window.updTrans('p','z',this.value)">
                    <input type="number" class="prop-input" id="rz" step="1" oninput="window.updTrans('r','z',this.value)">
                    <input type="number" class="prop-input" id="sz" step="0.1" oninput="window.updTrans('s','z',this.value)">
                </div>
                <div style="width:100%; height:1px; background:var(--border); margin:15px 0;"></div>
            `;

            if(isGroup && window.editingMaterials && window.editingMaterials.length > 0) {
                let options = window.editingMaterials.map((m, i) => `<option value="${i}" ${m === window.activeEditingMaterial ? 'selected' : ''}>${m.name || 'Material '+i}</option>`).join('');
                content.innerHTML += `
                    <div style="margin-bottom:10px; font-size:11px; color:var(--text-dim);">Edit Sub-Material:</div>
                    <select class="mat-selector" onchange="window.changeEditingMaterial(this.value)">${options}</select>
                `;
            }

            if(isGroup && (!window.editingMaterials || window.editingMaterials.length === 0)) {
                content.innerHTML += `<button class="context-btn danger" style="width:100%; height:40px; font-size:12px; border: 1px solid var(--border);" onclick="window.ungroupSelected()">Ungroup Objects</button>`;
            } else if(isBone) {
                content.innerHTML += `<div style="text-align:center; font-size:11px; color:var(--text-dim);">Rotate this bone and add a Keyframe (+) to animate the rig!</div>`;
            } else if(isCamera) {
                let isPiloting = window.engine.activeCamera === window.selectedObject.userData.cameraObj;
                content.innerHTML += `<button class="context-btn ${isPiloting ? 'active' : ''}" style="width:100%; height:40px; border: 1px solid var(--border); font-size:13px;" onclick="window.togglePilot()"><i class="fa-solid fa-video"></i> ${isPiloting ? 'Exit Pilot Mode' : 'Pilot Camera'}</button>`;
            } else if(isLight) {
                const l = window.selectedObject.userData.lightSource;
                content.innerHTML += `
                    <div class="prop-row">
                        <span class="prop-label">Intensity</span>
                        <input type="range" class="prop-slider" min="0" max="200" value="${l.intensity}" oninput="window.updLight('intensity', this.value)">
                    </div>
                    <div class="iro-picker" id="color-picker"></div>
                `;
                setTimeout(() => window.initColorPicker(l.color.getHexString(), (hex) => { l.color.set(hex); window.selectedObject.material.color.set(hex); }), 10);
            } 
            
            if (window.activeEditingMaterial && !isLight && !isCamera && !isBone) {
                const m = window.activeEditingMaterial;
                
                content.innerHTML += `
                    <button class="node-editor-btn" onclick="window.openNodeEditor()"><i class="fa-solid fa-project-diagram"></i> Open Node Editor</button>
                    <div style="width:100%; height:1px; background:var(--border); margin:15px 0;"></div>
                    <div class="iro-picker" id="color-picker"></div>
                    <div class="prop-row">
                        <span class="prop-label">Rough</span>
                        <input type="range" class="prop-slider" min="0" max="100" value="${m.roughness*100}" oninput="window.updMat('roughness', this.value)">
                    </div>
                    <div class="prop-row">
                        <span class="prop-label">Metal</span>
                        <input type="range" class="prop-slider" min="0" max="100" value="${m.metalness*100}" oninput="window.updMat('metalness', this.value)">
                    </div>
                    ${window.getTexPreviewHTML(m.map, 'Base Color / Video', 'map', true)}
                    ${window.getTexPreviewHTML(m.normalMap, 'Normal Map', 'normalMap', false)}
                    ${window.getTexPreviewHTML(m.roughnessMap || m.aoMap, 'ORM Map', 'ormMap', false)}
                `;
                setTimeout(() => window.initColorPicker(m.color.getHexString(), (hex) => m.color.set(hex)), 10);
            }
            window.updateTransformUI();
        };

        window.getTextureDataURL = function(tex) {
            if (!tex) return null;
            if (tex.userData && tex.userData.src) return tex.userData.src;
            if (tex.image && tex.image.src && typeof tex.image.src === 'string' && tex.image.src.startsWith('data:')) { 
                tex.userData = tex.userData || {}; 
                tex.userData.src = tex.image.src; 
                return tex.image.src; 
            }
            if (tex.image) { 
                try { 
                    const canvas = document.createElement('canvas'); 
                    canvas.width = tex.image.width || 256; 
                    canvas.height = tex.image.height || 256; 
                    const ctx = canvas.getContext('2d'); 
                    ctx.drawImage(tex.image, 0, 0, canvas.width, canvas.height); 
                    const url = canvas.toDataURL('image/png'); 
                    tex.userData = tex.userData || {}; 
                    tex.userData.src = url; 
                    return url; 
                } catch(e) { } 
            } 
            return null;
        }

        window.getTexPreviewHTML = function(tex, label, id, acceptsVideo) {
            let imgHTML = ''; 
            let name = 'No Media';
            if (tex) { 
                name = tex.name || (tex.isVideoTexture ? 'Video Texture' : 'Image Map'); 
                if (tex.isVideoTexture) {
                    imgHTML = `<div style="position:absolute; inset:0; background:rgba(37,99,235,0.4); display:flex; align-items:center; justify-content:center;"><i class="fa-solid fa-video" style="font-size:24px; color:white; opacity:0.8;"></i></div>`;
                } else {
                    let src = window.getTextureDataURL(tex); 
                    if (src) {
                        imgHTML = `<img src="${src}" class="tex-preview-img">`; 
                    } else {
                        imgHTML = `<div style="position:absolute; inset:0; background:rgba(37,99,235,0.2);"></div>`; 
                    }
                }
            }
            const accepts = acceptsVideo ? "image/*,video/*" : "image/*";
            return `
            <label class="tex-upload" onclick="document.getElementById('${id}').click()">
                ${imgHTML}
                <span><i class="fa-solid ${acceptsVideo ? 'fa-photo-film' : 'fa-image'}"></i> ${label}</span>
                <span style="font-weight:normal; font-size:9px; color:#aaa; max-width: 90%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${name}</span>
                <input type="file" id="${id}" accept="${accepts}" style="display:none" onchange="window.handleDirectMediaUpload(event, '${id}')">
            </label>`;
        }

        window.initColorPicker = function(hex, onChange) {
            if(window.colorPicker) document.getElementById('color-picker').innerHTML = '';
            window.colorPicker = new iro.ColorPicker('#color-picker', { width: 140, color: "#"+hex, layout: [{component: iro.ui.Wheel}] }); 
            window.colorPicker.on('color:change', (c) => onChange(c.hexString));
        };

        window.updateTransformUI = function() {
            if(!window.selectedObject) return;
            const setVal = (id, val) => { const el = document.getElementById(id); if(el && document.activeElement !== el) el.value = val; };
            setVal('px', window.selectedObject.position.x.toFixed(2)); setVal('py', window.selectedObject.position.y.toFixed(2)); setVal('pz', window.selectedObject.position.z.toFixed(2));
            setVal('rx', THREE.MathUtils.radToDeg(window.selectedObject.rotation.x).toFixed(0)); setVal('ry', THREE.MathUtils.radToDeg(window.selectedObject.rotation.y).toFixed(0)); setVal('rz', THREE.MathUtils.radToDeg(window.selectedObject.rotation.z).toFixed(0));
            setVal('sx', window.selectedObject.scale.x.toFixed(2)); setVal('sy', window.selectedObject.scale.y.toFixed(2)); setVal('sz', window.selectedObject.scale.z.toFixed(2));
        };

        window.updTrans = function(type, axis, val) {
            if(!window.selectedObject) return; 
            const v = parseFloat(val); 
            if(isNaN(v)) return;
            if(type === 'p') window.selectedObject.position[axis] = v; 
            if(type === 'r') window.selectedObject.rotation[axis] = THREE.MathUtils.degToRad(v); 
            if(type === 's') window.selectedObject.scale[axis] = v;
        };

        window.updLight = function(prop, val) { 
            if(window.selectedObject) window.selectedObject.userData.lightSource[prop] = parseFloat(val); 
        };
        window.updMat = function(prop, val) { 
            if(window.activeEditingMaterial) window.activeEditingMaterial[prop] = parseFloat(val)/100; 
        };

        // --- DRAWFLOW NODE EDITOR ---
        window.addDrawflowTexture = function() {
            const html = `
                <div style="font-size:12px; font-weight:bold; margin-bottom:5px;">Texture Map</div>
                <label style="background:var(--accent); color:white; padding:6px 12px; border-radius:4px; font-size:10px; cursor:pointer;" onclick="window.triggerGlobalFileInput('tex-node-${Date.now()}')">Upload Image</label>
                <div class="df-tex-name" style="font-size:9px; color:#aaa; margin-top:5px; max-width:130px; overflow:hidden;">No file</div>
            `;
            window.editor.addNode('texture', 0, 1, 50, 100, 'tex-node', { tex: null }, html, false);
        };

        window.triggerGlobalFileInput = function(nodeId) {
            document.getElementById('active-node-id').value = nodeId;
            document.getElementById('global-node-tex-input').click();
        };

        window.handleGlobalNodeUpload = function(event) {
            if(!event.target.files.length) return;
            const file = event.target.files[0]; 
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image(); 
                img.onload = () => {
                    const tex = new THREE.Texture(img); 
                    tex.wrapS = THREE.RepeatWrapping; 
                    tex.wrapT = THREE.RepeatWrapping; 
                    tex.colorSpace = THREE.SRGBColorSpace; 
                    tex.needsUpdate = true; 
                    tex.name = file.name;
                    tex.userData = { src: e.target.result }; 
                    
                    const nodes = window.editor.export().drawflow.Home.data;
                    let targetId = null;
                    for (let id in nodes) { 
                        if(nodes[id].name === 'texture' && !nodes[id].data.tex) { targetId = id; break; } 
                    }
                    
                    if(targetId) {
                        window.editor.updateNodeDataFromId(targetId, { tex: tex });
                        const el = document.getElementById('node-'+targetId);
                        if(el) el.querySelector('.df-tex-name').innerText = file.name;
                        
                        const node = window.editor.getNodeFromId(targetId);
                        if(node.outputs.output_1 && node.outputs.output_1.connections.length > 0) { 
                            node.outputs.output_1.connections.forEach(conn => { 
                                window.applyNodeMaterialConnection(node.id, conn.node, conn.output, conn.input); 
                            }); 
                        }
                    }
                }; 
                img.src = e.target.result;
            }; 
            reader.readAsDataURL(file);
        };

        window.openNodeEditor = function() {
            document.getElementById('node-editor-panel').style.display = 'flex';
            if(!window.editor) initNodeEditor(); 
            else buildGraphFromActiveMaterial();
        };

        window.closeNodeEditor = function() { 
            document.getElementById('node-editor-panel').style.display = 'none'; 
            window.buildPropertiesPanel(); 
        };

        window.applyNodeMaterialConnection = function(outId, inId, outClass, inClass) {
            const outNode = window.editor.getNodeFromId(outId); 
            const inNode = window.editor.getNodeFromId(inId);
            
            if(inNode.name === 'material' && outNode.data.tex && window.activeEditingMaterial) {
                const tex = outNode.data.tex;
                if(inClass === 'input_1') window.activeEditingMaterial.map = tex;
                if(inClass === 'input_2') window.activeEditingMaterial.normalMap = tex;
                if(inClass === 'input_3') { 
                    window.activeEditingMaterial.aoMap = tex; 
                    window.activeEditingMaterial.roughnessMap = tex; 
                    window.activeEditingMaterial.metalnessMap = tex; 
                    if(window.selectedObject && window.selectedObject.geometry && window.selectedObject.geometry.attributes.uv && !window.selectedObject.geometry.attributes.uv2) {
                        window.selectedObject.geometry.setAttribute('uv2', window.selectedObject.geometry.attributes.uv);
                    }
                }
                window.activeEditingMaterial.needsUpdate = true;
            }
        };

        function initNodeEditor() {
            const canvas = document.getElementById("drawflow"); 
            window.editor = new Drawflow(canvas); 
            window.editor.start();
            
            window.editor.on('connectionCreated', function(info) { 
                window.applyNodeMaterialConnection(info.output_id, info.input_id, info.output_class, info.input_class); 
            });
            
            window.editor.on('connectionRemoved', function(info) {
                const inNode = window.editor.getNodeFromId(info.input_id);
                if(inNode.name === 'material' && window.activeEditingMaterial) {
                    if(info.input_class === 'input_1') window.activeEditingMaterial.map = null;
                    if(info.input_class === 'input_2') window.activeEditingMaterial.normalMap = null;
                    if(info.input_class === 'input_3') { 
                        window.activeEditingMaterial.aoMap = null; 
                        window.activeEditingMaterial.roughnessMap = null; 
                        window.activeEditingMaterial.metalnessMap = null; 
                    }
                    window.activeEditingMaterial.needsUpdate = true;
                }
            }); 
            
            buildGraphFromActiveMaterial();
        }

        function buildGraphFromActiveMaterial() {
            if(!window.activeEditingMaterial) return; 
            window.editor.clear();
            
            const matHtml = `
                <div style="font-size:12px; font-weight:bold; border-bottom:1px solid #444; padding-bottom:5px; margin-bottom:5px;">PBR Material</div>
                <div style="font-size:10px; margin-top:14px;">Base Color</div>
                <div style="font-size:10px; margin-top:28px;">Normal Map</div>
                <div style="font-size:10px; margin-top:28px;">ORM Map</div>
            `;
            const matNodeId = window.editor.addNode('material', 3, 0, 250, 100, 'mat-node', {}, matHtml, false);
            
            const addExistingTex = (tex, label, yPos, inSlot) => {
                if(!tex) return;
                const html = `
                    <div style="font-size:12px; font-weight:bold; margin-bottom:5px;">Texture Map</div>
                    <label style="background:var(--accent); color:white; padding:6px 12px; border-radius:4px; font-size:10px; cursor:pointer;" onclick="window.triggerGlobalFileInput('tex-node-${Date.now()}')">Upload Image</label>
                    <div class="df-tex-name" style="font-size:9px; color:#aaa; margin-top:5px; max-width:130px; overflow:hidden;">${tex.name || label}</div>
                `;
                const tId = window.editor.addNode('texture', 0, 1, 20, yPos, 'tex-node', { tex: tex }, html, false);
                window.editor.addConnection(tId, matNodeId, 'output_1', 'input_' + inSlot);
            };
            
            addExistingTex(window.activeEditingMaterial.map, "Base Color", 50, 1);
            addExistingTex(window.activeEditingMaterial.normalMap, "Normal Map", 180, 2);
            addExistingTex(window.activeEditingMaterial.roughnessMap || window.activeEditingMaterial.aoMap, "ORM Map", 310, 3);
        }

        try {
            window.engine = new StudioEngine('render-canvas');
            window.engine.render(); 
            renderSplash();
        } catch(e) {
            const log = document.getElementById('debug-log'); 
            log.style.display = 'block'; 
            log.innerHTML += 'BOOT ERROR: ' + e.message + '<br>';
        }
    </script>
</body>
</html>
